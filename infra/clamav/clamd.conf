##
## clamd.conf — DataShare
##
## Starts from the image's own defaults (everything below except the size
## limits matches what clamav/clamav:stable ships commented-out at the same
## values). The only real change is the three size limits: the stock 100M/
## 100M/400M defaults reject anything above the app's old 50 MB scan cap
## once that cap moves — see backend/src/scan/scan.constants.ts and
## SECURITY.md for why 1200M (headroom above the app's 1 GiB cap, in
## ClamAV's binary M unit).
##

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# INSTREAM protocol limit (what ClamAvClient uses) — see comment above.
StreamMaxLength 1200M
# Applies to the stream's own reconstructed "file" too, not just the wire
# transfer — leaving this at the 100M default would still reject anything
# over 100M even with StreamMaxLength raised.
MaxFileSize 1200M
# Governs total bytes scanned across nested archive contents. Same file for
# a plain upload, but kept aligned so a zip/docx isn't limited differently.
MaxScanSize 1200M
