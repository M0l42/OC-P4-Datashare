global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# 127.0.0.11 : le résolveur DNS embarqué de Docker (même choix que
# infra/nginx/nginx.conf). `make scale` change le nombre de réplicas au
# lancement, pas dans docker-compose.yml : HAProxy doit donc découvrir les
# adresses de l'API par DNS à l'exécution plutôt que par des lignes `server`
# figées, sous peine de ne jamais voir les réplicas au-delà de la première.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

frontend fe_api
    bind *:3000
    default_backend be_api

backend be_api
    balance roundrobin
    # /api/health est la sonde de liveness et ne touche jamais la base
    # (health.controller.ts) : un réplica avec Postgres injoignable y répondrait
    # quand même 200, et continuerait de recevoir du trafic qu'il ne peut pas
    # honorer. La sonde d'un load balancer doit être la readiness.
    option httpchk GET /api/health/ready
    http-check expect status 200
    # 10 emplacements : large marge au-dessus des 1-3 réplicas comparés par
    # QA-06, chaque emplacement inactif reste simplement hors service.
    server-template api- 10 api:3000 check resolvers docker init-addr none resolve-prefer ipv4

# Page de stats : vérifier à l'œil que la charge se répartit bien entre
# réplicas pendant le test k6 de QA-06.
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
