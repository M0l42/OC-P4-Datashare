worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs au format JSON : PERF.md exige des logs structurés et des métriques
  # exploitables. `request_time` et `upstream_response_time` sont ce qui permet
  # de distinguer « nginx est lent » de « l'API est lente ».
  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","upstream":"$upstream_addr",'
    '"ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ───────────────────────────────────────────────────────────────────────────
  # Résolution DNS des conteneurs FRONT (Vite).
  #
  # 127.0.0.11 est le résolveur embarqué de Docker. Il est indispensable pour
  # `front` : nginx open source ne résout les noms d'un bloc `upstream` QU'AU
  # DÉMARRAGE, or le conteneur front se recrée souvent en développement (son
  # code change, il redémarre) et change d'adresse IP à chaque fois — nginx
  # continuerait alors d'appeler l'ancienne adresse et répondrait 502 jusqu'à
  # son propre redémarrage.
  #
  # Le contournement est de passer par une VARIABLE dans `proxy_pass`, ce qui
  # force nginx à résoudre le nom à chaque requête (avec le cache `valid=10s`).
  #
  # ipv6=off : sans cette option, une résolution AAAA peut être tentée en
  # premier alors que les services écoutent en IPv4, ce qui produit des échecs
  # intermittents difficiles à lire.
  #
  # /api/ n'a PAS ce problème et n'utilise donc PAS cette technique (voir le
  # bloc `upstream haproxy_upstream` plus bas) : HAProxy, contrairement à
  # front ou à l'ancien accès direct à api, ne se recrée quasiment jamais
  # pendant une session de dev — sa config ne change pas au fil de l'édition
  # du code back ou front.
  # ───────────────────────────────────────────────────────────────────────────
  resolver 127.0.0.11 valid=10s ipv6=off;

  # HAProxy (SOC-06) fait la répartition sur les réplicas de l'API ; ce n'est
  # jamais le rôle de nginx ici. Contrairement à `front`, ce conteneur n'a
  # pratiquement aucune raison d'être recreé en cours de session de dev — un
  # `server` classique, résolu une fois au démarrage, est donc un compromis
  # sûr, ET c'est ce qui permet `keepalive` : mesuré sous k6 (PERF.md), la
  # variante par variable (une connexion TCP neuve par requête, faute de pool
  # de connexions possible sans bloc `upstream` figé) épuise les ports
  # éphémères de nginx et produit des 502 intermittents dès qu'un débit
  # suffisant est atteint (visible seulement une fois HAProxy en place : avant
  # SOC-06, un seul réplica ne montait jamais assez haut pour le déclencher).
  # Si HAProxy est recréé en dev, `docker compose restart nginx` répare —
  # coût jugé acceptable au vu du gain.
  upstream haproxy_upstream {
    server haproxy:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Les octets des fichiers ne traversent PAS nginx : le navigateur parle
    # directement à MinIO via des URLs pré-signées. Les requêtes qui arrivent
    # ici ne portent que quelques Ko de JSON, donc `client_max_body_size` n'a
    # rien à voir avec la limite de 1 Go des fichiers. La valeur ci-dessous
    # couvre les corps JSON, pas des téléversements.
    client_max_body_size 1m;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://haproxy_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # Vide + HTTP/1.1 : la paire requise pour que nginx réutilise les
      # connexions du pool `keepalive` ci-dessus au lieu d'en ouvrir une
      # neuve à chaque requête.
      proxy_set_header   Connection        "";
      proxy_read_timeout 60s;
    }

    # ── Rechargement à chaud de Vite ─────────────────────────────────────────
    # WebSocket : sans Upgrade et Connection, le client HMR ne se connecte pas
    # et les modifications ne s'appliquent jamais, sans message d'erreur.
    location /@vite/client {
      set $front_target http://front:5173;
      proxy_pass         $front_target;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }

    # ── Front ────────────────────────────────────────────────────────────────
    # En développement, on proxifie le serveur Vite. En production, cette
    # section est remplacée par le service de fichiers statiques du bundle
    # compilé (voir la cible `production` de frontend/Dockerfile).
    location / {
      set $front_root http://front:5173;
      proxy_pass         $front_root;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
    }
  }
}
