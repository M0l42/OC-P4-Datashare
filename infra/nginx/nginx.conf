worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs au format JSON : PERF.md exige des logs structurés et des métriques
  # exploitables. `request_time` et `upstream_response_time` sont ce qui permet
  # de distinguer « nginx est lent » de « l'API est lente ».
  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","upstream":"$upstream_addr",'
    '"ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ───────────────────────────────────────────────────────────────────────────
  # Résolution DNS des conteneurs.
  #
  # 127.0.0.11 est le résolveur embarqué de Docker. Il est indispensable ici :
  # nginx open source ne résout les noms d'un bloc `upstream` QU'AU DÉMARRAGE.
  # Or on recrée le conteneur api en permanence en développement, et il change
  # d'adresse IP à chaque fois — nginx continuerait alors d'appeler l'ancienne
  # adresse et répondrait 502 jusqu'à son propre redémarrage.
  #
  # Le contournement est de passer par une VARIABLE dans `proxy_pass`, ce qui
  # force nginx à résoudre le nom à chaque requête (avec le cache `valid=10s`).
  #
  # ipv6=off : sans cette option, une résolution AAAA peut être tentée en
  # premier alors que les services écoutent en IPv4, ce qui produit des échecs
  # intermittents difficiles à lire.
  #
  # Conséquence assumée : on perd le bloc `upstream`, donc `keepalive` et la
  # répartition de charge multi-réplicas. Ce n'est pas une perte réelle — nginx
  # ne répartissait de toute façon pas la charge, puisqu'un `server api:3000`
  # ne retient qu'une seule adresse résolue au démarrage. La répartition
  # effective sur N réplicas est le rôle de HAProxy (SOC-06), qui est
  # précisément la tâche qui produit la comparaison de charge de PERF.md.
  # ───────────────────────────────────────────────────────────────────────────
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # Les octets des fichiers ne traversent PAS nginx : le navigateur parle
    # directement à MinIO via des URLs pré-signées. Les requêtes qui arrivent
    # ici ne portent que quelques Ko de JSON, donc `client_max_body_size` n'a
    # rien à voir avec la limite de 1 Go des fichiers. La valeur ci-dessous
    # couvre les corps JSON, pas des téléversements.
    client_max_body_size 1m;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
      # Variable obligatoire : c'est ce qui force la re-résolution DNS.
      set $api_target http://api:3000;
      proxy_pass         $api_target;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 60s;
    }

    # ── Rechargement à chaud de Vite ─────────────────────────────────────────
    # WebSocket : sans Upgrade et Connection, le client HMR ne se connecte pas
    # et les modifications ne s'appliquent jamais, sans message d'erreur.
    location /@vite/client {
      set $front_target http://front:5173;
      proxy_pass         $front_target;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }

    # ── Front ────────────────────────────────────────────────────────────────
    # En développement, on proxifie le serveur Vite. En production, cette
    # section est remplacée par le service de fichiers statiques du bundle
    # compilé (voir la cible `production` de frontend/Dockerfile).
    location / {
      set $front_root http://front:5173;
      proxy_pass         $front_root;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
    }
  }
}
